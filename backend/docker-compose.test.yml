# Throwaway Postgres for the backend test suite (optional - without it the
# tests run against in-process PGlite). From backend/:
#
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5433/postgres npm test   # PowerShell: $env:TEST_DATABASE_URL='...'; npm test
#   docker compose -f docker-compose.test.yml down
#
# Each test file creates (and drops) its own database on this server, so the
# default `postgres` database is only used as the admin connection.
services:
  postgres-test:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data   # RAM-backed: fast, and nothing to clean up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
