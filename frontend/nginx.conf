server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (the JS bundle is ~420 kB uncompressed)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Baseline security headers.
    # NOTE: nginx does NOT inherit add_header into a location that defines its
    # own add_header, so every location below that sets headers repeats this
    # block. Keep the copies in sync.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # HSTS only makes sense (and is only honoured) over HTTPS. Enable it where TLS
    # is terminated for this site — here, or on the proxy in front of it — and
    # only once you are sure the site will stay HTTPS:
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Client IP for the API's rate limiters. $proxy_add_x_forwarded_for appends
    # the address nginx actually saw ($remote_addr) to whatever X-Forwarded-For
    # the client sent, so the REAL client IP is always the LAST hop; anything a
    # client forges sits before it. The API runs with `trust proxy` = 1
    # (TRUST_PROXY=1), and Express then takes exactly that last hop as req.ip, so
    # a forged header can neither dodge nor poison a rate-limit bucket. Without
    # the header every user would share nginx's IP (one bucket for everyone).
    # If another proxy (Caddy/Traefik/...) sits in front of this nginx, set
    # TRUST_PROXY=2: then the last hop is that proxy and the one before it the
    # real client, which only works if that outer proxy also appends to
    # X-Forwarded-For (they do by default).

    # Server-Sent Events (real-time Audiobookshelf progress). Must come with
    # buffering off and a long read timeout, or nginx buffers the stream and cuts
    # it after 60 s. The API also sends `X-Accel-Buffering: no` and a heartbeat
    # comment every 25 s. (Longest prefix wins, so this beats `location /api/`.)
    location /api/integrations/sse {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Digital Asset Links — must not redirect to index.html
    location /.well-known/ {
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames — safe to cache forever.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Not content-hashed: the browser must revalidate them so a new deploy (and a
    # new service worker) is picked up immediately instead of after the cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
