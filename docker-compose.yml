services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookworm}
      POSTGRES_USER: ${POSTGRES_USER:-bookworm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-bookworm} -d ${POSTGRES_DB:-bookworm} -c 'SELECT 1' -q --no-align --tuples-only"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bookworm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bookworm}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      COVERS_DIR: /app/data/covers
      COVERS_MAX_MB: ${COVERS_MAX_MB:-}
      REQUIRE_INVITE: ${REQUIRE_INVITE:-false}
      INTEGRATIONS_KEY: ${INTEGRATIONS_KEY:-}
      INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:-}
      PG_TIMEZONE: ${PG_TIMEZONE:-UTC}
    volumes:
      - covers:/app/data/covers
    depends_on:
      db:
        condition: service_healthy
    # Uses the image's HEALTHCHECK (GET /api/health); declared here so the
    # frontend can wait on it and `docker compose ps` shows the state.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-/api}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  covers:
